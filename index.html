<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05060c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Jujutsu Roguelite — a Hades-inspired JJK action roguelite in your browser." />
    <title>Jujutsu Roguelite — Domain of the Ten Shadows</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23090a12'/%3E%3Cpath d='M4 3h8v2H9v8H7V5H4z' fill='%23ff2a4a'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game" width="640" height="360" aria-label="Jujutsu Roguelite game canvas"></canvas>
    </div>
    <div id="rotate-hint">
      <div class="rotate-box">
        <div class="rotate-icon">⟳</div>
        <div class="rotate-title">ROTATE YOUR DEVICE</div>
        <div class="rotate-sub">Jujutsu Roguelite is built for landscape. Turn your phone sideways for the full arena.</div>
        <button id="fs-btn">GO FULLSCREEN</button>
      </div>
    </div>
    <noscript>
      <div style="color:#fff;font-family:monospace;padding:24px;text-align:center">
        Jujutsu Roguelite needs JavaScript enabled.
      </div>
    </noscript>
    <script type="module" src="./src/main.js"></script>
    <script>
      // fullscreen button on the rotate hint
      const btn = document.getElementById('fs-btn');
      if (btn) {
        btn.addEventListener('click', () => {
          const el = document.documentElement;
          const p = el.requestFullscreen?.() || el.webkitRequestFullscreen?.();
          if (p && p.then) {
            p.then(() => {
              try { screen.orientation?.lock?.('landscape').catch(() => {}); } catch (e) {}
            }).catch(() => {});
          }
        });
      }
    </script>
  </body>
</html>
